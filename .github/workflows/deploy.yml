name: CI/CD Pipeline & Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Next.js Frontend — Lint, TypeScript Type Check & Vitest TDD Suite
  # ---------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        working-directory: dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard
        run: npm run lint

      - name: Run TypeScript Compiler Check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Execute Vitest Test Suite
        working-directory: dashboard
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 2: Python Strands Agent — Pytest & Pydantic Contract Validation
  # ---------------------------------------------------------------------------
  agent-verification:
    name: Python Agent Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install Agent Dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite with Pydantic Contracts
        run: python -m pytest agent/tests/ -v

  # ---------------------------------------------------------------------------
  # Job 3: Continuous Deployment — Next.js Dashboard to Vercel
  # (Only runs on push to main branch after verification passes)
  # ---------------------------------------------------------------------------
  deploy-frontend:
    name: Deploy Dashboard to Vercel
    needs: [frontend-verification, agent-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: dashboard
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        working-directory: dashboard
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Production Artifacts to Vercel
        working-directory: dashboard
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ---------------------------------------------------------------------------
  # Job 4: Continuous Deployment — Supabase Edge Functions
  # (Only runs on push to main branch after verification passes)
  # ---------------------------------------------------------------------------
  deploy-edge-functions:
    name: Deploy Supabase Edge Functions
    needs: [frontend-verification, agent-verification]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions to Supabase
        run: |
          supabase functions deploy api-router --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy agent-sweep --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy seed-data --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy decisions-approve --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy decisions-reject --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
